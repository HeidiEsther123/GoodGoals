name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restaurar
        run: dotnet restore GoodGoals.slnx

      - name: Compilar
        run: dotnet build GoodGoals.slnx --no-restore

      - name: Correr pruebas
        run: dotnet test GoodGoals.slnx --no-build
